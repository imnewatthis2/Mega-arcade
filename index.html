<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Arcade 🎮</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d1b;
  color: white;
}

header {
  text-align: center;
  padding: 25px 12px;
  background: linear-gradient(135deg, #641bff, #00c9ff);
}

h1 { margin: 0 0 12px; font-size: 34px; }

#search {
  width: min(95%, 500px);
  padding: 14px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
}

main { padding: 16px; }

#games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

.game {
  color: white;
  background: #18223d;
  border: 1px solid #34446d;
  border-radius: 15px;
  min-height: 125px;
  padding: 16px 8px;
  font-size: 16px;
  cursor: pointer;
}

.game:hover { background: #303f68; }

.emoji {
  display: block;
  font-size: 40px;
  margin-bottom: 8px;
}

#player { display: none; }

#frame {
  width: 100%;
  height: 72vh;
  min-height: 400px;
  border: 0;
  border-radius: 12px;
  background: white;
}

button.action {
  padding: 12px 16px;
  margin: 5px 5px 12px 0;
  border: 0;
  border-radius: 9px;
  background: #7545ff;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.note {
  color: #c1cbe3;
  line-height: 1.5;
}

footer {
  padding: 25px;
  text-align: center;
  color: #9eabc9;
}
</style>
</head>

<body>
<header>
  <h1>🎮 MEGA ARCADE</h1>
  <p>Pick a game and start playing!</p>
  <input id="search" placeholder="🔎 Search games…"
         aria-label="Search games">
</header>

<main>
  <section id="home">
    <h2>🔥 All Games</h2>
    <div id="games"></div>
  </section>

  <section id="player">
    <button class="action" id="back">⬅ Back</button>
    <button class="action" id="full">⛶ Fullscreen</button>
    <button class="action" id="open">Open Game ↗</button>
    <h2 id="title"></h2>
    <iframe id="frame"
      title="Game player"
      allow="fullscreen; autoplay; gamepad"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <p class="note" id="status">
      If the game does not load, use Open Game to visit its website.
    </p>
  </section>
</main>

<footer>🎮 Mega Arcade — Game time!</footer>

<script>
const gameList = [
  { name: "Retro Bowl", emoji: "🏈",
    url: https://retrobowl.me/ },
  { name: "Basketball Stars", emoji: "🏀",
    url: "https://www.crazygames.com/game/basketball-stars" },
  { name: "Slope", emoji: "🔴",
    url: "https://www.crazygames.com/game/slope" },
  { name: "Moto X3M", emoji: "🏍️",
    url: "https://www.crazygames.com/game/moto-x3m" },
  { name: "Run 3", emoji: "🏃",
    url: "https://www.coolmathgames.com/0-run-3" },
  { name: "2048", emoji: "🔢",
    url: "https://play2048.co/" },
  { name: "Cookie Clicker", emoji: "🍪",
    url: "https://orteil.dashnet.org/cookieclicker/" },
  { name: "Chess", emoji: "♟️",
    url: "https://www.chess.com/play/computer" },
  { name: "Pac-Man", emoji: "👻",
    url: "https://www.google.com/logos/2010/pacman10-i.html" },
  { name: "Tetris", emoji: "🧱",
    url: "https://tetris.com/play-tetris" },
  { name: "Agar.io", emoji: "🔵",
    url: "https://agar.io/" }
];

const home = document.getElementById("home");
const player = document.getElementById("player");
const games = document.getElementById("games");
const frame = document.getElementById("frame");
const search = document.getElementById("search");

let currentGame = null;

function renderGames(query = "") {
  games.replaceChildren();

  const matches = gameList.filter(game =>
    game.name.toLowerCase().includes(query.toLowerCase())
  );

  matches.forEach(game => {
    const card = document.createElement("button");
    card.className = "game";

    const emoji = document.createElement("span");
    emoji.className = "emoji";
    emoji.textContent = game.emoji;

    card.append(emoji, document.createTextNode(game.name));
    card.addEventListener("click", () => launchGame(game));
    games.appendChild(card);
  });

  if (!matches.length) {
    games.textContent = "No games found. Try another search!";
  }
}

function launchGame(game) {
  currentGame = game;
  home.style.display = "none";
  player.style.display = "block";

  document.getElementById("title").textContent = game.name;
  document.getElementById("status").textContent =
    "Loading game. If it is blocked, tap Open Game.";
  frame.src = game.url;

  window.scrollTo(0, 0);
}

document.getElementById("back").addEventListener("click", () => {
  frame.src = "about:blank";
  player.style.display = "none";
  home.style.display = "block";
  currentGame = null;
});

document.getElementById("open").addEventListener("click", () => {
  if (currentGame) {
    window.open(currentGame.url, "_blank", "noopener,noreferrer");
  }
});

document.getElementById("full").addEventListener("click", () => {
  if (frame.requestFullscreen) {
    frame.requestFullscreen();
  }
});

search.addEventListener("input", () => {
  renderGames(search.value);
});

renderGames();
</script>
</body>
</html>
