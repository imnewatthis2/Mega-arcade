\<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mega Arcade</title><style>body {  margin: 0;  font-family: Arial, sans-serif;  background: #101020;  color: white;  text-align: center;}header { padding: 25px 10px; background: #7028ff; }h1 { margin: 0; font-size: 34px; }#search {  padding: 13px;  width: 80%;  max-width: 400px;  border-radius: 10px;  border: 0;  margin: 20px;  font-size: 16px;}#games {  display: grid;  grid-template-columns: repeat(auto-fit,minmax(145px,1fr));  gap: 14px;  padding: 15px;  max-width: 1000px;  margin: auto;}.game {  background: #24243e;  padding: 20px 8px;  border-radius: 14px;  border: 1px solid #48486c;}.game .emoji { font-size: 42px; }.game h3 { margin: 12px 0; }button {  background: #a45bff;  color: white;  border: 0;  border-radius: 8px;  padding: 11px;  cursor: pointer;  font-weight: bold;}button:hover { background: #8135e9; }#player { padding: 10px; }#player iframe {  width: 100%;  height: 65vh;  border: 0;  border-radius: 12px;  background: white;}#player a { color: #d6b5ff; }.hidden { display: none; }</style></head><body><header>  <h1>🎮 MEGA ARCADE 🎮</h1>  <p>Pick a game and start playing!</p></header><input id="search" placeholder="🔎 Search games..."       oninput="filterGames()" /><div id="games"></div><div id="player" class="hidden">  <h2 id="gameTitle">Game</h2>  <p id="gameMessage"></p>  <div id="screen"></div>  <p><button onclick="closeGame()">⬅ Back to Games</button></p></div><script>const gameList = [  {name:"Retro Bowl", emoji:"🏈",   url:"https://retrobowl.me/"},  {name:"Basketball Stars", emoji:"🏀",   url:"https://www.basketballstars.com/"},  {name:"Slope", emoji:"🔴",   url:"https://slopegame.io/"},  {name:"Run 3", emoji:"🏃",   url:"https://run3.io/"},  {name:"1v1.LOL", emoji:"🔫",   url:"https://1v1.lol/"},  {name:"2048", emoji:"🔢",   url:"https://play2048.co/"},  {name:"Cookie Clicker", emoji:"🍪",   url:"https://orteil.dashnet.org/cookieclicker/"},  {name:"A Dark Room", emoji:"🌑",   url:"https://adarkroom.doublespeakgames.com/"},  {name:"Geometry Dash Lite", emoji:"🟦",   url:"https://geometrydashlite.io/"},  {name:"Chess", emoji:"♟️",   url:"https://www.chess.com/play/computer"},  {name:"Tetris", emoji:"🧱",   url:"https://tetris.com/play-tetris"},  {name:"Google Pac-Man", emoji:"👻",   url:"https://www.google.com/logos/2010/pacman10-i.html"}];function renderGames(list = gameList) {  const games = document.getElementById("games");  games.innerHTML = "";  list.forEach(game => {    const card = document.createElement("div");    card.className = "game";    const emoji = document.createElement("div");    emoji.className = "emoji";    emoji.textContent = game.emoji;    const title = document.createElement("h3");    title.textContent = game.name;    const button = document.createElement("button");    button.textContent = "▶ Play";    button.onclick = () => openGame(game);    card.append(emoji, title, button);    games.appendChild(card);  });}function filterGames() {  const query = document.getElementById("search")    .value.toLowerCase();  renderGames(gameList.filter(game =>    game.name.toLowerCase().includes(query)  ));}function openGame(game) {  document.getElementById("player").classList.remove("hidden");  document.getElementById("gameTitle").textContent = game.name;  document.getElementById("games").classList.add("hidden");  document.getElementById("search").classList.add("hidden");  const screen = document.getElementById("screen");  screen.innerHTML = "";  const link = document.createElement("a");  link.href = game.url;  link.target = "_blank";  link.rel = "noopener noreferrer";  link.textContent = "Open Game in a New Tab";  link.style.display = "inline-block";  link.style.padding = "12px";  const frame = document.createElement("iframe");  frame.src = game.url;  frame.title = game.name;  frame.allow = "fullscreen; autoplay";  frame.referrerPolicy = "no-referrer";  document.getElementById("gameMessage").textContent =    "If the game doesn't load below, use the button to open it.";  screen.append(frame, document.createElement("br"), link);}function closeGame() {  document.getElementById("player").classList.add("hidden");  document.getElementById("games").classList.remove("hidden");  document.getElementById("search").classList.remove("hidden");  document.getElementById("screen").innerHTML = "";}renderGames();</script></body></html>
