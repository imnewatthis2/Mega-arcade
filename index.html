<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mega Arcade</title><style>  body {    margin: 0;    padding: 20px;    background: #101020;    color: white;    font-family: Arial, sans-serif;    text-align: center;  }  h1 { color: #00f5ff; font-size: 36px; }  #games {    display: grid;    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));    gap: 14px;    max-width: 1000px;    margin: 25px auto;  }  .game {    background: #242442;    border: 2px solid #654cff;    border-radius: 14px;    padding: 20px 8px;    color: white;    font-size: 17px;    cursor: pointer;  }  .game:active { background: #454578; }  #player {    display: none;    width: 100%;    max-width: 1000px;    height: 65vh;    margin: 20px auto;    border: 0;    background: white;  }  #back { display: none; }</style></head><body><h1>🎮 MEGA ARCADE</h1><p>Pick a game and start playing!</p><div id="games"></div><button id="back" onclick="closeGame()">← Back to Games</button><iframe id="player" allowfullscreen></iframe><script>const games = [  {name:"Retro Bowl", url:"https://retro-bowl.net/"},  {name:"Basketball Stars", url:"https://www.basketballstars.com/"},  {name:"2048", url:"https://play2048.co/"},  {name:"Slope", url:"https://slopegame.io/"},  {name:"Cookie Clicker", url:"https://orteil.dashnet.org/cookieclicker/"},  {name:"Flappy Bird", url:"https://flappybird.io/"},  {name:"Geometry Dash", url:"https://geometrydash.io/"},  {name:"Moto X3M", url:"https://motox3m.io/"},  {name:"Run 3", url:"https://run3.io/"},  {name:"Pac-Man", url:"https://www.google.com/logos/2010/pacman10-i.html"}];const list = document.getElementById("games");games.forEach(game => {  const button = document.createElement("button");  button.className = "game";  button.textContent = "🎮 " + game.name;  button.onclick = () => openGame(game.url);  list.appendChild(button);});function openGame(url) {  document.getElementById("player").src = url;  document.getElementById("player").style.display = "block";  document.getElementById("back").style.display = "inline-block";  document.getElementById("games").style.display = "none";}function closeGame() {  document.getElementById("player").src = "about:blank";  document.getElementById("player").style.display = "none";  document.getElementById("back").style.display = "none";  document.getElementById("games").style.display = "grid";}</script></body></html>
