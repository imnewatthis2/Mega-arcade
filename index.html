<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mega Arcade 🎮</title><style>*{box-sizing:border-box}body{margin:0;background:#090d1c;color:white;font-family:Arial,sans-serif}header{text-align:center;padding:28px 12px;background:linear-gradient(135deg,#652bff,#00b8ff)}h1{font-size:38px;margin:0}header p{margin-bottom:0}main{max-width:1100px;margin:auto;padding:16px}input{width:100%;padding:14px;border-radius:12px;border:0;font-size:16px;margin-bottom:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button,.game button,#back{border:0;border-radius:10px;padding:11px;background:#273454;color:white;cursor:pointer}nav button.active{background:#b7ff59;color:#101522}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.game{background:#161f36;border:1px solid #303c5c;padding:15px;border-radius:15px;min-height:155px;display:flex;flex-direction:column;gap:9px}.emoji{font-size:38px}.game h3{font-size:17px;margin:0}.game small{color:#b8c5e3}.game button{background:#7554ff;margin-top:auto;font-weight:bold}#player{display:none;margin-top:20px;padding:12px;background:#161f36;border-radius:15px}#player h2{font-size:20px}iframe{width:100%;height:65vh;border:0;border-radius:10px;background:white}a{color:#b7ff59}.note{color:#b8c5e3;font-size:13px;line-height:1.5}</style></head><body><header><h1>🎮 MEGA ARCADE</h1><p>One website. Tons of games. Endless fun!</p></header><main><input id="search" placeholder="🔎 Search for a game..." oninput="render()"><nav id="filters"></nav><div id="games"></div><section id="player"><button id="back" onclick="closeGame()">⬅ Back to games</button><h2 id="title"></h2><iframe id="frame" allow="fullscreen; autoplay; gamepad" title="Game window"></iframe><p class="note">If the game doesn't load here, its website may block embedding.</p><a id="external" target="_blank" rel="noopener noreferrer">Open this game in a new tab ↗</a></section><p class="note">Games belong to their respective owners. Some may open externally or have device restrictions.</p></main><script>const games=[["Retro Bowl","🏈","Sports","https://www.retrobowl.com/"],["Basketball Stars","🏀","Sports","https://www.basketballstars.com/"],["Basket Random","🏀","Sports","https://poki.com/en/g/basket-random"],["Soccer Skills","⚽","Sports","https://poki.com/en/g/soccer-skills-world-cup"],["Moto X3M","🏍️","Racing","https://poki.com/en/g/moto-x3m"],["Drift Boss","🚗","Racing","https://drift-boss.com/"],["Subway Surfers","🚇","Action","https://poki.com/en/g/subway-surfers"],["Temple Run 2","🏃","Action","https://poki.com/en/g/temple-run-2"],["Stickman Hook","🪝","Action","https://poki.com/en/g/stickman-hook"],["Minecraft Classic","🧱","Adventure","https://classic.minecraft.net/"],["Fireboy & Watergirl","🔥","Puzzle","https://poki.com/en/g/fireboy-and-watergirl-1-forest-temple"],["2048","🔢","Puzzle","https://play2048.co/"],["Chess","♟️","Puzzle","https://www.chess.com/play/computer"],["Tetris","🧩","Puzzle","https://tetris.com/play-tetris"],["Cookie Clicker","🍪","Casual","https://orteil.dashnet.org/cookieclicker/"],["Slither.io","🐍","Casual","https://slither.io/"],["Agar.io","🟣","Casual","https://agar.io/"],["Cut the Rope","🍬","Puzzle","https://poki.com/en/g/cut-the-rope"],["Wordle","🔤","Puzzle","https://www.nytimes.com/games/wordle/index.html"],["A Dark Room","🌌","Adventure","https://adarkroom.doublespeakgames.com/"]];const categories=["All","Sports","Racing","Action","Puzzle","Adventure","Casual"];let category="All";function makeFilters(){const nav=document.getElementById("filters");nav.innerHTML="";categories.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=c===category?"active":"";b.onclick=()=>{category=c;makeFilters();render()};nav.appendChild(b);});}function render(){const q=document.getElementById("search").value.toLowerCase();const root=document.getElementById("games");root.innerHTML="";const found=games.filter(g=>(category==="All"||g[2]===category)&&g[0].toLowerCase().includes(q));if(!found.length){root.textContent="No games found. Try another search.";return;}found.forEach(g=>{const card=document.createElement("div");card.className="game";const emoji=document.createElement("div");emoji.className="emoji";emoji.textContent=g[1];const name=document.createElement("h3");name.textContent=g[0];const tag=document.createElement("small");tag.textContent=g[2];const btn=document.createElement("button");btn.textContent="▶ PLAY";btn.onclick=()=>launch(g);card.append(emoji,name,tag,btn);root.appendChild(card);});}function launch(g){document.getElementById("player").style.display="block";document.getElementById("title").textContent=g[1]+" "+g[0];document.getElementById("frame").src=g[3];document.getElementById("external").href=g[3];document.getElementById("player").scrollIntoView({behavior:"smooth"});}function closeGame(){document.getElementById("frame").src="about:blank";document.getElementById("player").style.display="none";}makeFilters();render();</script></body></html>
