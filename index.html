<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Games 🎮</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
  text-align: center;
}

header {
  padding: 25px 12px;
  background: linear-gradient(120deg, #ff0055, #00ffcc);
}

h1 { margin: 0; font-size: 36px; }

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px;
}

button {
  padding: 13px 20px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #292929;
  color: white;
  transition: background 0.2s;
}

button.active { background: #ff0055; }
button:hover { opacity: .85; }

main { padding: 12px; }

.player {
  max-width: 850px;
  margin: 15px auto;
  padding: 15px;
  background: #1c1c1c;
  border-radius: 16px;
}

iframe {
  width: 100%;
  height: 600px;
  border: none;
  border-radius: 12px;
  background: #222;
}

footer {
  padding: 25px;
  color: #aaa;
}
</style>
</head>

<body>
<header>
  <h1>🎮 MEGA GAMES 🕹️</h1>
  <p>Your games. Your arcade.</p>
</header>

<nav>
  <button class="active" onclick="showGame('pacman', this)">
    🟡 Pac-Man
  </button>
  <button onclick="showGame('tetris', this)">
    🧱 Tetris
  </button>
  <button onclick="showGame('space', this)">
    🚀 Space Invaders
  </button>
</nav>

<main>
  <!-- Pacman Game -->
  <section id="pacman" class="player">
    <h2>🟡 Classic Pac-Man</h2>
    <p>Chomp the dots and avoid the ghosts!</p>
    <iframe src="https://pacman.live" loading="lazy"></iframe>
  </section>

  <!-- Tetris Game -->
  <section id="tetris" class="player" hidden>
    <h2>🧱 Classic Tetris</h2>
    <p>Clear the lines and stack the blocks!</p>
    <iframe src="https://github.io" loading="lazy"></iframe>
  </section>

  <!-- Space Invaders Game -->
  <section id="space" class="player" hidden>
    <h2>🚀 Space Invaders</h2>
    <p>Defend the skies from the alien attack!</p>
    <iframe src="https://freeinvaders.org" loading="lazy"></iframe>
  </section>
</main>

<footer>
  Made for gamers 🎮
</footer>

<script>
function showGame(gameId, button) {
  // Hide all game sections
  document.getElementById('pacman').hidden = gameId !== 'pacman';
  document.getElementById('tetris').hidden = gameId !== 'tetris';
  document.getElementById('space').hidden = gameId !== 'space';

  // Toggle active button style
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.remove('active')
  );
  button.classList.add('active');
}
</script>
</body>
</html>
