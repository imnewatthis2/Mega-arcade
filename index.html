<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Music 🎧</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
  text-align: center;
}

header {
  padding: 25px 12px;
  background: linear-gradient(120deg, #1db954, #ff5500);
}

h1 { margin: 0; font-size: 36px; }

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px;
}

button {
  padding: 13px 20px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #292929;
  color: white;
}

button.active { background: #1db954; }
button:hover { opacity: .85; }

main { padding: 12px; }

.player {
  max-width: 850px;
  margin: 15px auto;
  padding: 15px;
  background: #1c1c1c;
  border-radius: 16px;
}

iframe {
  width: 100%;
  border: none;
  border-radius: 12px;
  background: #222;
}

.spotify { height: 500px; }
.soundcloud { height: 500px; }

a { color: #1db954; }

footer {
  padding: 25px;
  color: #aaa;
}
</style>
</head>

<body>
<header>
  <h1>🎧 MEGA MUSIC 🎵</h1>
  <p>Your music. Your vibe.</p>
</header>

<nav>
  <!-- Fixed curly quotes “ ” to standard straight quotes " " -->
  <button class="active" onclick="showMusic('spotify', this)">
    🟢 Spotify
  </button>
  <button onclick="showMusic('soundcloud', this)">
    🟠 SoundCloud
  </button>
</nav>

<main>
  <!-- Fixed curly quotes on IDs and classes -->
  <section id="spotify" class="player">
    <h2>🟢 Spotify</h2>
    <p>Play music, albums, and playlists.</p>
    <!-- Fixed: Added double-quotes around the verified Spotify Today's Top Hits URL -->
    <iframe class="spotify"
      src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
    <p><a href="https://open.spotify.com/" target="_blank"
      rel="noopener">Open Spotify directly ↗</a></p>
  </section>

  <section id="soundcloud" class="player" hidden>
    <h2>🟠 SoundCloud</h2>
    <p>Discover mixes, remixes, and new music.</p>
    <iframe class="soundcloud"
      src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/charts/top&color=%23ff5500&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&visual=true"
      allow="autoplay"
      loading="lazy">
    </iframe>
    <p><a href="https://soundcloud.com/" target="_blank"
      rel="noopener">Open SoundCloud directly ↗</a></p>
  </section>
</main>

<footer>
  Made for music lovers 🎶
</footer>

<script>
function showMusic(service, button) {
  document.getElementById('spotify').hidden = service !== 'spotify';
  document.getElementById('soundcloud').hidden = service !== 'soundcloud';

  document.querySelectorAll('nav button').forEach(b =>
    b.classList.remove('active')
  );
  button.classList.add('active');
}
</script>
</body>
</html>
