<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Unblocker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 2px solid #333;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #00adb5;
        }
        button {
            padding: 10px 20px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #007a80;
        }
        .container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 75px);
            background-color: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <input type="text" id="url-input" placeholder="Enter URL (e.g., https://example.com)">
        <button onclick="loadWebsite()">Go</button>
    </header>

    <div class="container">
        <iframe id="viewer" src="about:blank"></iframe>
    </div>

    <script>
        function loadWebsite() {
            let input = document.getElementById('url-input').value.trim();
            let iframe = document.getElementById('viewer');

            if (!input) {
                alert('Please enter a valid URL.');
                return;
            }

            // Automatically prepend https:// if missing
            if (!/^https?:\/\//i.test(input)) {
                input = 'https://' + input;
            }

            // Using a public proxy prefix to bypass simple restrictions.
            // Note: Highly secure sites (like Google or YouTube) block this method.
            const proxyUrl = "https://corsproxy.io?"; 
            
            iframe.src = proxyUrl + encodeURIComponent(input);
        }

        // Allow pressing 'Enter' to search
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadWebsite();
            }
        });
    </script>
</body>
</html>
